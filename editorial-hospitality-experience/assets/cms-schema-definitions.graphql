"""
Luxury Hospitality Headless CMS Schema Definitions
Decoupled Content Architecture for Editorial Flagships
"""

type Property implements Node {
  id: ID!
  slug: String!
  name: String!
  brandSubTitle: String
  tagline: String!
  editorialSummary: String!
  region: String!
  country: String!
  coordinates: GeoCoordinates!
  heroMedia: MediaAsset!
  spatialMediaGallery: [MediaAsset!]!
  featuredRooms: [RoomCategory!]!
  diningVenues: [DiningVenue!]!
  wellnessOfferings: [WellnessOffering!]!
  curatedExperiences: [Experience!]!
  policies: PropertyPolicies!
  directBookingPerks: [DirectPerk!]!
  pmsPropertyId: String!
}

type GeoCoordinates {
  latitude: Float!
  longitude: Float!
  elevationMeters: Int
}

type MediaAsset {
  id: ID!
  url: String!
  altText: String!
  caption: String
  credit: String
  aspectRatio: String! # e.g. "16:9", "4:3", "1:1"
  mediaType: MediaType! # EDITORIAL_CROP, SPATIAL_WIDE, FLOOR_PLAN_SVG, AMBIENT_VIDEO
  focalPoint: FocalPoint
  dimensions: ImageDimensions!
  colorPalette: [String!]
}

enum MediaType {
  EDITORIAL_CROP
  SPATIAL_WIDE
  FLOOR_PLAN_SVG
  AMBIENT_VIDEO
}

type FocalPoint {
  x: Float!
  y: Float!
}

type ImageDimensions {
  width: Int!
  height: Int!
}

type RoomCategory implements Node {
  id: ID!
  slug: String!
  pmsRoomTypeId: String!
  title: String!
  subtitle: String
  architecturalOverview: String!
  tierLevel: RoomTier!
  squareFootage: Int!
  squareMeters: Int!
  maxOccupancy: OccupancyLimits!
  bedConfiguration: String!
  viewOrientation: String!
  floorPlanSvg: MediaAsset!
  heroMedia: MediaAsset!
  mediaGallery: [MediaAsset!]! # Enforces 30% detail crops / 70% wide shots
  amenities: [Amenity!]!
  includedServices: [String!]!
  startingRate: Money!
}

enum RoomTier {
  GUEST_ROOM
  SUITE
  SPECIALTY_SUITE
  VILLA
  RESIDENCE
}

type OccupancyLimits {
  maxAdults: Int!
  maxChildren: Int!
  maxTotalOccupancy: Int!
  rollawayBedAllowed: Boolean!
}

type Money {
  amount: Float!
  currencyCode: String! # ISO 4217
  formattedAmount: String!
}

type RatePlan implements Node {
  id: ID!
  pmsRateCode: String! # e.g. "BAR-BB-NONREF"
  displayName: String! # Plain language: "Stay & Breakfast"
  headlineSummary: String!
  includedBenefits: [String!]!
  cancellationPolicy: CancellationTerms!
  paymentRequirement: PaymentTerms!
  isDirectExclusive: Boolean!
}

type CancellationTerms {
  isRefundable: Boolean!
  freeCancellationDeadlineHours: Int
  plainLanguageSummary: String!
  penaltyDetails: String
}

type PaymentTerms {
  depositRequiredPercent: Float!
  paymentDueTiming: PaymentTiming!
  plainLanguageSummary: String!
}

enum PaymentTiming {
  IMMEDIATE_AT_BOOKING
  UPON_CHECK_IN
  UPON_CHECK_OUT
}

type DiningVenue implements Node {
  id: ID!
  name: String!
  cuisineType: String!
  chefName: String
  michelinRating: String
  editorialCopy: String!
  heroMedia: MediaAsset!
  menuPdfUrl: String
  reservationUrl: String
}

type WellnessOffering implements Node {
  id: ID!
  title: String!
  category: String! # Spa, Thermal, Fitness, Mindful
  summary: String!
  treatmentMenuUrl: String
}

type Experience implements Node {
  id: ID!
  title: String!
  locationScope: String!
  durationMinutes: Int
  summary: String!
  media: MediaAsset!
}

type PropertyPolicies {
  checkInTime: String!
  checkOutTime: String!
  guaranteePolicy: String!
  cancellationOverview: String!
  petPolicy: String!
  childrenPolicy: String!
}

type DirectPerk {
  id: ID!
  title: String!
  description: String!
  iconToken: String!
}
